<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Phase 3 — Game Flow</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="hud">
      <span id="fps">FPS: --</span>
      <span id="pinchDebug">pinch: --</span>
      <span id="status">Loading model…</span>
      <span id="scoreHud"></span>
      <button id="categoriesBtn" type="button">🎯 Categories</button>
      <button id="cameraSwitchBtn" type="button">Switch Camera</button>
      <button id="exitBtn" type="button">✕ Exit</button>
    </div>

    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>

      <div id="promptThumb" class="hidden"></div>
      <div id="instructionHint" class="hidden">Pinch thumb + finger together to grab a letter, drop it in a box</div>

      <button id="submitBtn" type="button">Submit</button>
    </div>

    <div id="zoomOverlay" class="hidden">
      <div id="zoomVisual"></div>
      <div id="zoomHint">✌️ Hold up a peace sign to zoom</div>
    </div>

    <div id="resultOverlay" class="hidden">
      <div id="resultText"></div>
      <div id="resultWord"></div>
      <button id="nextBtn" type="button">Next Word</button>
    </div>

    <div id="startOverlay" class="hidden">
      <div id="teamTurnBanner" class="hidden"></div>
      <div id="promptDisplay"></div>
      <button id="startBtn" type="button">Start Camera</button>
      <a id="menuLink" href="index.html">🏠 Back to Menu</a>
      <img id="mascotCorner" src="song_song_Body%20Spell%20Challenge/mascot.png" alt="" />
    </div>

    <div id="categoryOverlay" class="hidden">
      <div id="categoryTitle">Pick what to play! 🌟</div>
      <div id="categoryList"></div>
      <button id="categoryPlayBtn" type="button">PLAY! 🎉</button>
      <img id="mascotCategory" src="song_song_Body%20Spell%20Challenge/mascot.png" alt="" />
    </div>

    <div id="modeOverlay">
      <div id="categoryTitle">How do you want to play?</div>
      <div id="modeList">
        <button id="modeSoloBtn" type="button" class="mode-btn">🙋 Solo Practice</button>
        <button id="modeTeamBtn" type="button" class="mode-btn">🔴 vs 🔵 Team Battle</button>
      </div>
      <img id="mascotMode" src="song_song_Body%20Spell%20Challenge/mascot.png" alt="" />
    </div>

    <div id="summaryOverlay" class="hidden">
      <div class="summary-card">
        <div id="summaryTrophy">🏆</div>
        <div id="summaryTitle">Great job!</div>
        <div id="summaryScore"></div>
        <div class="summary-actions">
          <button id="playAgainBtn" type="button">🔄 Play Again</button>
          <button id="newSetupBtn" type="button">🎯 New Setup</button>
          <a id="summaryMenuLink" href="index.html">🏠 Back to Menu</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
